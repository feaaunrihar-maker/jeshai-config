version: 1.3.13
cache: true

interface:
  webSearch: true
  modelSelect: true
  agents: true

webSearch:
  searchProvider: tavily
  tavilyApiKey: "${TAVILY_API_KEY}"
  scraperType: jina
  safeSearch: 1

endpoints:
  agents:
    recursionLimit: 15
    maxRecursionLimit: 25
  custom:
    # --- GROQ ---
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1/"
      streamRate: 25
      models:
        default:
          - "openai/gpt-oss-120b"
          - "qwen/qwen3-32b"
        fetch: false
      titleConvo: true
      titleModel: "openai/gpt-oss-120b"
      modelDisplayLabel: "Groq Free"

    # --- OPENROUTER ---
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      streamRate: 25
      models:
        default:
          - "openrouter/free"
          - "google/gemini-2.0-flash-exp:free"
          - "meta-llama/llama-3.3-70b-instruct:free"
          - "qwen/qwen-2.5-coder-32b-instruct:free"
          - "deepseek/deepseek-r1:free"
        fetch: false
      titleConvo: true
      titleModel: "openrouter/free"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter Free"

# --- REMOTE MCP SERVERS (0 MB RAM लोड) ---
mcpServers:
  composio:
    type: streamable-http
    url: "https://connect.composio.dev/mcp"
    headers:
      x-consumer-api-key: "${COMPOSIO_API_KEY}"
    timeout: 30000
