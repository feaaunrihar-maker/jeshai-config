version: 1.3.13
cache: true

interface:
  webSearch: true
  modelSelect: true # (या false कर दें अगर आप मॉडल का ड्रॉपडाउन पूरी तरह छिपाना चाहते हैं)

webSearch:
  searchProvider: tavily
  tavilyApiKey: "${TAVILY_API_KEY}"
  scraperType: jina
  safeSearch: 1

endpoints:
  custom:
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      streamRate: 25
      models:
        default:
          - "llama-3.3-70b-versatile"
          - "llama-3.2-11b-vision-preview"
        fetch: true
      titleConvo: true
      titleTiming: "immediate"
      titleMethod: "completion"
      titleModel: "llama-3.3-70b-versatile"
      modelDisplayLabel: "Jesh Smart (Groq)"

    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      streamRate: 25
      headers:
        HTTP-Referer: "https://jeshai-librechat.onrender.com"
        X-Title: "Jesh AI"
      models:
        default:
          - "openrouter/free"
        fetch: false
      titleConvo: true
      titleTiming: "immediate"
      titleMethod: "completion"
      titleModel: "openrouter/free"
      modelDisplayLabel: "Jesh Backup (OpenRouter)"
