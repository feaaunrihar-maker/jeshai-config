version: 1.3.13
cache: true

# --- PHASE 3: CLEAN & FOCUSED UI ---
interface:
  customWelcome: "Jesh AI में आपका स्वागत है! आज हम किस विषय पर काम करें?"
  webSearch: true
  modelSelect: true
  agents: true
  endpointsMenu: true
  parameters: false
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false

# --- VOICE CHAT: RECORD FIRST, MANUAL SEND ---
# --- VOICE CHAT: RECORD FIRST, MANUAL SEND ---
speech:
  stt:
    openai:
      apiKey: "${GROQ_API_KEY}"
      url: "https://api.groq.com/openai/v1/audio/transcriptions"
      model: "whisper-large-v3-turbo"
  tts:
    edge: true
  speechTab:
    conversationMode: false
    advancedMode: false
    speechToText:
      engineSTT: "external"
      languageSTT: "hi-IN"
      autoTranscribeAudio: false
      autoSendText: -1
    textToSpeech:
      automaticPlayback: true
      voice: "hi-IN-SwaraNeural"


# --- 512MB RAM PROTECTION: SCREENSHOT, CAMERA & PDF VISION ---
fileConfig:
  endpoints:
    custom:
      fileLimit: 5
      fileSizeLimit: 10
    agents:
      fileLimit: 5
      fileSizeLimit: 10
  serverFileSizeLimit: 15

# --- WEB SEARCH (TAVILY + JINA) ---
webSearch:
  searchProvider: tavily
  tavilyApiKey: "${TAVILY_API_KEY}"
  scraperType: jina
  safeSearch: 1

# --- TRIPLE-ENGINE AI ENDPOINTS (GEMINI + GROQ + OPENROUTER) ---
endpoints:
  agents:
    recursionLimit: 15
    maxRecursionLimit: 25

  custom:
    - name: "Google"
      apiKey: "${GOOGLE_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      streamRate: 25
      models:
        default:
          - "gemini-2.5-flash"
          - "gemini-2.5-pro"
        fetch: false
      titleConvo: true
      titleModel: "gemini-2.5-flash"
      modelDisplayLabel: "Google Gemini"

    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1/"
      streamRate: 25
      models:
        default:
          - "openai/gpt-oss-120b"
          - "llama-3.1-8b-instant"
        fetch: true
      titleConvo: true
      titleModel: "llama-3.1-8b-instant"
      modelDisplayLabel: "Groq Free"

    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      streamRate: 25
      models:
        default:
          - "openrouter/free"
          - "deepseek/deepseek-r1:free"
        fetch: false
      titleConvo: true
      titleModel: "openrouter/free"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter Free"

# --- PHASE 4 & 5: REMOTE MCP SERVERS (0 MB RAM लोड) ---
mcpServers:
  composio:
    type: streamable-http
    url: "https://connect.composio.dev/mcp"
    headers:
      x-consumer-api-key: "${COMPOSIO_API_KEY}"
    timeout: 30000

  agnes:
    type: streamable-http
    url: "https://mcp.agnes.ai/mcp"
    headers:
      Authorization: "Bearer ${AGNES_API_KEY}"
    timeout: 60000
    serverInstructions: "Use this tool to generate videos from text prompts whenever the user asks to create or generate a video."

  github:
    type: sse
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
    timeout: 30000
    serverInstructions: "Use this tool to read GitHub repositories, inspect skill templates, and manage code files."
    
