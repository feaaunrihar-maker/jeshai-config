version: 1.3.13
cache: true

# --- PHASE 3: CLEAN & FOCUSED UI ---
interface:
  customWelcome: "Jesh AI में आपका स्वागत है! आज हम किस विषय पर काम करें?"
  webSearch: true
  modelSelect: true
  agents: true
  endpointsMenu: true
  parameters: false
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false

# --- WEB SEARCH (TAVILY + JINA) ---
webSearch:
  searchProvider: tavily
  tavilyApiKey: "${TAVILY_API_KEY}"
  scraperType: jina
  safeSearch: 1

# --- PHASE 6: TRIPLE-ENGINE AI ENDPOINTS (GEMINI + GROQ + OPENROUTER) ---
endpoints:
  agents:
    recursionLimit: 15
    maxRecursionLimit: 25

  # 1. GOOGLE GEMINI (मुख्य इंजन - विशाल कॉन्टेक्स्ट विंडो)
  google:
    models:
      default:
        - "gemini-2.5-flash"
        - "gemini-2.5-pro"
      fetch: false

  custom:
    # 2. GROQ (सिर्फ सक्रिय और तेज़ मॉडल्स)
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1/"
      streamRate: 25
      models:
        default:
          - "llama-3.3-70b-versatile"
          - "llama-3.1-8b-instant"
          - "openai/gpt-oss-120b"
        fetch: false
      titleConvo: true
      titleModel: "llama-3.1-8b-instant"
      modelDisplayLabel: "Groq Free"

    # 3. OPENROUTER (सिर्फ भरोसेमंद फ्री राउटर, फालतू मॉडल्स हटा दिए गए हैं)
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      streamRate: 25
      models:
        default:
          - "openrouter/free"
          - "deepseek/deepseek-r1:free"
        fetch: false
      titleConvo: true
      titleModel: "openrouter/free"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter Free"

# --- PHASE 4: REMOTE MCP SERVERS (0 MB RAM लोड) ---
mcpServers:
  composio:
    type: streamable-http
    url: "https://connect.composio.dev/mcp"
    headers:
      x-consumer-api-key: "${COMPOSIO_API_KEY}"
    timeout: 30000

  agnes:
    type: streamable-http
    url: "https://mcp.agnes.ai/mcp"
    headers:
      Authorization: "Bearer ${AGNES_API_KEY}"
    timeout: 60000
    serverInstructions: "Use this tool to generate videos from text prompts whenever the user asks to create or generate a video."

  github:
    type: sse
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
    timeout: 30000
    serverInstructions: "Use this tool to read GitHub repositories, inspect skill templates, and manage code files."
    
