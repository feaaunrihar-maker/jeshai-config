version: 1.3.13
cache: true

interface:
  webSearch: true
  modelSelect: true

webSearch:
  searchProvider: tavily
  tavilyApiKey: "${TAVILY_API_KEY}"
  scraperType: jina
  safeSearch: 1

endpoints:
  custom:
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      streamRate: 25
      models:
        default:
          - "llama-3.3-70b-versatile"
          - "llama-3.2-11b-vision-preview"
        fetch: false  # मॉडल्स को ऑटो-फ़ेच करने से रोकें
      titleConvo: true
      titleTiming: "immediate"
      titleMethod: "completion"
      titleModel: "llama-3.3-70b-versatile"  # टाइटल के लिए सही मॉडल
      modelDisplayLabel: "Jesh Smart (Groq)"

    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      streamRate: 25
      headers:
        HTTP-Referer: "https://jeshai-librechat.onrender.com"
        X-Title: "Jesh AI"
      models:
        default:
          - "nvidia/nemotron-3-ultra-550b-a55b:free"  # एक स्पेसिफिक फ्री मॉडल
        fetch: false
      titleConvo: true
      titleTiming: "immediate"
      titleMethod: "completion"
      titleModel: "nvidia/nemotron-3-ultra-550b-a55b:free"
      modelDisplayLabel: "Jesh Backup (OpenRouter)"
