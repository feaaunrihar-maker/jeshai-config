version: 1.2.1
cache: true

endpoints:
  custom:
    # --- GROQ (सबसे तेज़ फ्री मॉडल्स: कोडिंग और चैट के लिए) ---
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1/"
      models:
        default:
          - "openai/gpt-oss-120b"
          - "llama-3.3-70b-versatile"
          - "llama-3.1-8b-instant"
          - "qwen-2.5-coder-32b"
          - "deepseek-r1-distill-llama-70b"
        fetch: false
      titleConvo: true
      titleModel: "llama-3.1-8b-instant"
      modelDisplayLabel: "Groq Free"

    # --- OPENROUTER (Auto-Switch और अतिरिक्त फ्री मॉडल्स के लिए) ---
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openrouter/free"
          - "google/gemini-2.0-flash-exp:free"
          - "meta-llama/llama-3.3-70b-instruct:free"
          - "qwen/qwen-2.5-coder-32b-instruct:free"
          - "deepseek/deepseek-r1:free"
        fetch: false
      titleConvo: true
      titleModel: "openrouter/free"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter Free"

# --- MCP सर्वर इंटीग्रेशन (GitHub के लिए) ---
mcpServers:
  github:
    type: sse
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_PAT}"
    serverInstructions: "Use this tool to search GitHub repositories, read code, and manage files."
    
